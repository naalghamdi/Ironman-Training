const STORAGE="mallorca703_v1";
let state=JSON.parse(localStorage.getItem(STORAGE)||"{}");
state.workouts=state.workouts||PLAN.workouts.map(x=>structuredClone(x));
state.settings=Object.assign({},PLAN.settings,state.settings||{});
state.checked=state.checked||{};
state.page=state.page||"home";
state.week=state.week||1;
function save(){localStorage.setItem(STORAGE,JSON.stringify({workouts:state.workouts,settings:state.settings,checked:state.checked,page:state.page,week:state.week}));}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function daysToRace(){return Math.max(0,Math.ceil((new Date(PLAN.meta.raceDate+"T23:59:59")-new Date())/86400000))}
function phaseForWeek(n){return PLAN.weeks[n-1]?.phase||""}
function workoutsForWeek(n){return state.workouts.filter(w=>w.week===n).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function durationMin(v){if(!v||v==="—")return 0;let m=String(v).match(/(\d+)/);return m?parseInt(m[1]):0}
function plannedStats(ws){let a={hours:0,swim:0,bike:0,run:0,strength:0,done:0,total:0};ws.forEach(w=>{a.total++;a.hours+=durationMin(w.duration)/60;if(w.discipline==="Swim")a.swim+=parseFloat(w.distance)||0;if(w.discipline==="Bike")a.bike+=parseFloat(w.distance)||0;if(w.discipline==="Run")a.run+=parseFloat(w.distance)||0;if(w.discipline==="Strength")a.strength++;if(w.status==="completed")a.done++});return a}
function weekStats(n){return plannedStats(workoutsForWeek(n))}
function currentWeek(){let i=PLAN.weeks.findIndex(w=>new Date(w.end+"T23:59:59")>=new Date());return i<0?PLAN.weeks.length:i+1}
function nav(){let items=[["home","Dashboard"],["weeks","Training Weeks"],["progress","Progress"],["settings","Settings"],["checklist","Race Checklist"],["course","Mallorca / Strategy"]];document.getElementById("nav").innerHTML=items.map(([id,t])=>`<button class="${state.page===id?"active":""}" onclick="go('${id}')">${t}</button>`).join("");document.getElementById("mobilebar").innerHTML=items.slice(0,5).map(([id,t])=>`<button class="${state.page===id?"active":""}" onclick="go('${id}')">${t}</button>`).join("")}
function go(p){state.page=p;save();render()}
function render(){nav();let v=document.getElementById("view");if(state.page==="home")v.innerHTML=home();if(state.page==="weeks")v.innerHTML=weeks();if(state.page==="progress")v.innerHTML=progress();if(state.page==="settings")v.innerHTML=settings();if(state.page==="checklist")v.innerHTML=checklist();if(state.page==="course")v.innerHTML=course();attach()}
function home(){let cw=currentWeek(),wk=PLAN.weeks[cw-1],ws=weekStats(cw),recent=state.workouts.filter(w=>w.status!=="planned").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);let prog=Math.min(100,Math.round(((new Date()-new Date(PLAN.meta.planStart))/(new Date(PLAN.meta.raceDate)-new Date(PLAN.meta.planStart)))*100));let today=new Date().toISOString().slice(0,10);let todayWs=state.workouts.filter(w=>w.date===today);return `<div class="top"><div><h1>Training Dashboard</h1><div class="muted">${fmtDate(PLAN.meta.planStart)} → ${fmtDate(PLAN.meta.raceDate)}</div></div><div class="goal"><span class="pill">GOAL ${esc(PLAN.meta.goal)}</span><span class="pill">${daysToRace()} DAYS</span></div></div>
<div class="grid cards"><div class="card"><div class="label">Countdown</div><div class="stat">${daysToRace()}d</div><div class="muted">to race day</div></div><div class="card"><div class="label">Current phase</div><div class="stat" style="font-size:19px">${esc(wk.phase)}</div><div class="muted">Week ${cw} of ${PLAN.weeks.length}</div></div><div class="card"><div class="label">Plan progress</div><div class="stat">${prog}%</div><div class="bar"><i style="width:${prog}%"></i></div></div><div class="card"><div class="label">Week completion</div><div class="stat">${ws.total?Math.round(ws.done/ws.total*100):0}%</div><div class="muted">${ws.done}/${ws.total} workouts</div></div></div>
<div class="section grid two"><div class="panel card"><h2>Today</h2>${todayWs.length?todayWs.map(compact).join(""):`<div class="notice">No plan item is scheduled today. Open Training Weeks to jump to the current week.</div>`}</div><div class="panel card"><h2>Current week</h2><p class="muted">${esc(wk.objective)}</p><div class="grid three"><div><div class="label">Hours</div><b>${ws.hours.toFixed(1)}</b></div><div><div class="label">Bike</div><b>${ws.bike.toFixed(0)} km</b></div><div><div class="label">Run</div><b>${ws.run.toFixed(1)} km</b></div></div><div class="actions"><button class="btn primary" onclick="state.week=${cw};go('weeks')">Open week</button></div></div></div>
<div class="section"><h2>Recent training</h2><div class="panel card">${recent.length?recent.map(w=>`<div class="check"><span class="status ${w.status}">${w.status}</span><div><b>${esc(w.title)}</b><div class="muted">${fmtDate(w.date)} · ${esc(w.actual.duration||w.duration||"—")} · ${esc(w.actual.distance||w.distance||"")}</div></div></div>`).join(""):`<div class="muted">No completed/modified/skipped workouts yet.</div>`}</div></div>`}
function compact(w){return `<div class="workout"><div class="summary"><div class="day">${esc(w.day)}</div><div><div class="wtitle">${icon(w.discipline)} ${esc(w.title)}</div><div class="meta">${esc(w.duration||"")} · ${esc(w.distance||"")} · ${esc(w.intensity||"")}</div></div><span class="status ${w.status}">${w.status}</span><button class="expand" onclick="toggle('${w.id}')">Expand ▾</button></div><div class="detail" id="d-${w.id}">${detail(w)}</div></div>`}
function icon(d){return {Swim:"🏊",Bike:"🚴",Run:"🏃",Strength:"🏋️",Recovery:"🧘",Triathlon:"🏁"}[d]||"•"}
function detail(w){return `<div class="detailgrid"><div class="box"><h4>Purpose</h4><p>${esc(w.purpose)}</p></div><div class="box"><h4>Prescription</h4><p>${esc(w.duration)} · ${esc(w.distance)} · ${esc(w.intensity)} · ${esc(w.hrZone)} · RPE ${esc(w.rpe)}</p></div><div class="box"><h4>Warm-up</h4><p>${esc(w.warmup)}</p></div><div class="box"><h4>Main set</h4><p>${esc(w.mainSet)}</p></div><div class="box"><h4>Cool-down</h4><p>${esc(w.cooldown)}</p></div><div class="box"><h4>Nutrition</h4><p>${esc(w.nutrition)}</p></div><div class="box"><h4>Coaching notes</h4><p>${esc(w.coachingNotes)}</p></div><div class="box"><h4>Actual results</h4><p>${esc(JSON.stringify(w.actual).replace(/[{}"]/g,"").replace(/,/g," · "))}</p></div></div><div class="actions"><button class="btn good" onclick="setStatus('${w.id}','completed')">Completed</button><button class="btn warn" onclick="setStatus('${w.id}','modified')">Modified</button><button class="btn bad" onclick="setStatus('${w.id}','skipped')">Skipped</button><button class="btn" onclick="setStatus('${w.id}','planned')">Planned</button><button class="btn primary" onclick="edit('${w.id}')">Edit</button></div>`}
function weeks(){let w=PLAN.weeks[state.week-1],ws=weekStats(state.week);return `<div class="top"><div><h1>Training Weeks</h1><div class="muted">Every planned session from start to race day</div></div><div class="weeknav"><button onclick="state.week=Math.max(1,state.week-1);render()">‹</button><select onchange="state.week=+this.value;render()">${PLAN.weeks.map((x,i)=>`<option value="${i+1}" ${state.week===i+1?"selected":""}>Week ${i+1} · ${x.phase}</option>`).join("")}</select><button onclick="state.week=Math.min(PLAN.weeks.length,state.week+1);render()">›</button></div></div>
<div class="panel card"><div class="grid three"><div><div class="label">Date range</div><b>${fmtDate(w.start)} – ${fmtDate(w.end)}</b></div><div><div class="label">Phase</div><b>${esc(w.phase)}</b></div><div><div class="label">Completion</div><b>${ws.total?Math.round(ws.done/ws.total*100):0}%</b></div></div><p class="muted">${esc(w.objective)}</p><div class="bar"><i style="width:${ws.total?ws.done/ws.total*100:0}%"></i></div></div>
<div class="section">${workoutsForWeek(state.week).map(compact).join("")}</div>`}
function edit(id){let w=state.workouts.find(x=>x.id===id);let d=document.getElementById("d-"+id);d.innerHTML=`<div class="editgrid">${field("Title","title",w.title)}${field("Duration","duration",w.duration)}${field("Distance","distance",w.distance)}${field("Intensity","intensity",w.intensity)}${field("HR zone","hrZone",w.hrZone)}${field("RPE","rpe",w.rpe)}${field("Purpose","purpose",w.purpose,true)}${field("Warm-up","warmup",w.warmup,true)}${field("Main set","mainSet",w.mainSet,true)}${field("Cool-down","cooldown",w.cooldown,true)}${field("Nutrition","nutrition",w.nutrition,true)}${field("Coaching notes","coachingNotes",w.coachingNotes,true)}</div><h4 style="margin:14px 0 8px">Actual results</h4><div class="editgrid">${field("Actual duration","actual.duration",w.actual.duration)}${field("Actual distance","actual.distance",w.actual.distance)}${field("Average HR","actual.hr",w.actual.hr)}${field("Average pace","actual.pace",w.actual.pace)}${field("Average power","actual.power",w.actual.power)}${field("Actual RPE","actual.rpe",w.actual.rpe)}${field("User notes","actual.notes",w.actual.notes,true)}</div><div class="actions"><button class="btn primary" onclick="saveEdit('${id}')">Save</button><button class="btn" onclick="render()">Cancel</button><button class="btn warn" onclick="resetWorkout('${id}')">Reset to original</button></div>`}
function field(label,path,val,area=false){let id="f-"+path.replace(".","-");return `<div class="field"><label>${esc(label)}</label>${area?`<textarea id="${id}">${esc(val)}</textarea>`:`<input id="${id}" value="${esc(val)}">`}</div>`}
function val(id,path){let el=document.getElementById("f-"+path.replace(".","-"));return el?el.value:""}
function saveEdit(id){let w=state.workouts.find(x=>x.id===id);["title","duration","distance","intensity","hrZone","rpe","purpose","warmup","mainSet","cooldown","nutrition","coachingNotes"].forEach(k=>w[k]=val(id,k));["duration","distance","hr","pace","power","rpe","notes"].forEach(k=>w.actual[k]=val(id,"actual."+k));save();render();setTimeout(()=>toggle(id),20)}
function resetWorkout(id){let o=PLAN.workouts.find(x=>x.id===id);let i=state.workouts.findIndex(x=>x.id===id);if(o)state.workouts[i]=structuredClone(o);save();render()}
function setStatus(id,s){let w=state.workouts.find(x=>x.id===id);w.status=s;save();render()}
function toggle(id){let d=document.getElementById("d-"+id);if(d)d.classList.toggle("open")}
function progress(){let weekly=PLAN.weeks.map((w,i)=>{let s=weekStats(i+1);return {i:i+1,h:s.hours,sw:s.swim,b:s.bike,r:s.run,done:s.done,total:s.total}});return `<div class="top"><div><h1>Progress</h1><div class="muted">Planned structure vs your recorded actuals</div></div></div><div class="grid two"><div class="panel card"><h2>Weekly training hours</h2><div class="chart"><canvas id="hours"></canvas></div></div><div class="panel card"><h2>Weekly volume</h2><div class="chart"><canvas id="vol"></canvas></div></div></div><div class="section panel card"><h2>Weekly review</h2><table class="table"><thead><tr><th>Week</th><th>Phase</th><th>Planned h</th><th>Recorded h</th><th>Swim</th><th>Bike</th><th>Run</th><th>Complete</th></tr></thead><tbody>${weekly.map((x,i)=>`<tr><td>${x.i}</td><td>${esc(PLAN.weeks[i].phase)}</td><td>${PLAN.weeks[i].plannedHours}</td><td>${x.h.toFixed(1)}</td><td>${x.sw.toFixed(1)} km</td><td>${x.b.toFixed(0)} km</td><td>${x.r.toFixed(1)} km</td><td>${x.total?Math.round(x.done/x.total*100):0}%</td></tr>`).join("")}</tbody></table></div>`}
function draw(id,series,labels,title){let c=document.getElementById(id);if(!c)return;let ctx=c.getContext("2d"),W=c.clientWidth,H=c.clientHeight,dpr=devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);let max=Math.max(...series,1),pad=28;ctx.strokeStyle="#263451";ctx.lineWidth=1;for(let i=0;i<5;i++){let y=pad+(H-pad*1.5)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke()}ctx.strokeStyle="#69b7ff";ctx.lineWidth=2;ctx.beginPath();series.forEach((v,i)=>{let x=pad+(W-pad*1.7)*i/(series.length-1||1),y=H-pad-(H-pad*1.8)*v/max;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#9eabc1";ctx.font="10px system-ui";labels.forEach((l,i)=>{if(i%4===0){let x=pad+(W-pad*1.7)*i/(labels.length-1||1);ctx.fillText(l,x-6,H-6)}})}
function attach(){if(state.page==="progress"){setTimeout(()=>{let labs=PLAN.weeks.map(x=>"W"+x.week);draw("hours",PLAN.weeks.map((_,i)=>weekStats(i+1).hours),labs);draw("vol",PLAN.weeks.map((_,i)=>weekStats(i+1).swim+weekStats(i+1).bike/10+weekStats(i+1).run),labs)},30)}}
function settings(){let fields=[["weight","Weight"],["height","Height"],["age","Age"],["maxHR","Maximum HR"],["restingHR","Resting HR"],["thresholdHR","Threshold HR"],["FTP","Cycling FTP"],["CSS","Swim CSS"],["runThresholdPace","Running threshold pace"],["weeklyVolume","Current weekly volume"],["preferredTrainingTimes","Preferred training times"],["injuryNotes","Injury / recovery notes"]];return `<div class="top"><div><h1>Settings</h1><div class="muted">Enter test data as it becomes available. The plan does not invent personal zones.</div></div></div><div class="panel card"><div class="editgrid">${fields.map(([k,l])=>`<div class="field"><label>${l}</label><input id="s-${k}" value="${esc(state.settings[k]||"")}"></div>`).join("")}</div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="resetSettings()">Reset defaults</button></div><div class="notice" style="margin-top:14px">Use your measured CSS, FTP, running threshold and HR data rather than guessing. When new test results are available, update these fields and use the recorded values to refine training targets.</div></div>`}
function saveSettings(){Object.keys(state.settings).forEach(k=>{let e=document.getElementById("s-"+k);if(e)state.settings[k]=e.value});save();render()}
function resetSettings(){state.settings=structuredClone(PLAN.settings);save();render()}
function checklist(){return `<div class="top"><div><h1>Race Checklist</h1><div class="muted">Tap items as they are acquired/tested/packed.</div></div></div><div class="panel card">${PLAN.checklist.map(([cat,txt],i)=>`<div class="check"><input type="checkbox" ${state.checked[i]?"checked":""} onchange="state.checked[${i}]=this.checked;save()"><div><b>${esc(cat)}</b><div class="muted">${esc(txt)}</div></div></div>`).join("")}</div>`}
function course(){return `<div class="top"><div><h1>Mallorca Strategy</h1><div class="muted">Verified course facts + coaching implementation</div></div></div><div class="grid two"><div class="panel card"><h2>Course facts</h2><p>The official IRONMAN athlete guide available for the Mallorca event lists a <b>90 km, one-loop bike course with about 850 m of elevation gain</b>. Local Alcúdia event information also describes the 1.9 km swim, 90 km bike and flat 21.1 km run, with the bike passing through the Serra de Tramuntana and the Coll de Femenia / Coll de la Batalla area.</p><p class="muted">Course layouts can change by edition; confirm the 2027 athlete guide when published.</p><h3>Riyadh climbing solution</h3><ul><li>Trainer: 6–12 min low-cadence blocks at upper Z2/low Z3.</li><li>Sweet-spot / threshold intervals to raise sustainable climbing power.</li><li>Over-unders and long continuous tempo to simulate changing gradients.</li><li>Practice aero-position endurance on flat roads.</li><li>One Mallorca/hilly trip in the race-specific phase is strongly useful but not required for every week.</li></ul></div><div class="panel card"><h2>Open-water strategy</h2><ul><li>Pool technique and continuous distance first.</li><li>First open-water trip: roughly 6–8 weeks before race day if logistics allow.</li><li>Second exposure: 2–4 weeks before race day for sighting, starts, contact, wetsuit and race-pace confidence.</li><li>Do not place unfamiliar open-water stress in the final few days.</li></ul><h3>Early-May conditions</h3><p>Historical climate sources put May daytime temperatures around the low 20s °C and sea water around the high teens °C; wind is variable. This is climate context, not a 2027 forecast.</p></div></div><div class="section panel card"><h2>Sub-6 framework</h2><p>A sub-6 finish generally requires the three legs plus transitions to add up to less than six hours. This dashboard deliberately avoids locking you into arbitrary pace/power numbers before your CSS, FTP and run-threshold data are known.</p><div class="notice">Illustrative planning bands: swim ~35–38 min; T1 ~4–6 min; bike ~3:00–3:10; T2 ~2–4 min; run ~1:45–1:52. These are planning bands only. Your actual targets should be recalculated from test data and race simulations.</div></div>`}
render();
</script>
</body>
</html>
